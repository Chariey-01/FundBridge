name: Frontend

# Checks for the React/Vite frontend, then browser journeys (desktop and mobile Chromium) against the
# real API: Alembic migrations, the first-admin CLI and gunicorn on PostgreSQL 16, with a production
# build of the frontend served by `vite preview`. PayPal is the repository's local test double
# (backend/tests/e2e/provider_doubles.py); no PayPal system is contacted and no money moves.

on:
  # No path filters: these checks are meant to be required, and a required check that never
  # starts would block the merge.
  pull_request:
  push:
    branches: [main, feat/backend-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    name: Typecheck, lint, unit tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

  browser:
    name: Browser journeys against the live API (PostgreSQL 16)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fundbridge
          POSTGRES_PASSWORD: fundbridge
          POSTGRES_DB: fundbridge_web_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fundbridge -d fundbridge_web_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Disposable: e2e/live_stack.py drops and recreates its public schema.
      E2E_DATABASE_URL: postgresql+psycopg://fundbridge:fundbridge@localhost:5432/fundbridge_web_e2e
      E2E_PYTHON: python
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend as deployed (requirements + gunicorn)
        run: pip install -r ../backend/requirements-deploy.txt
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys (desktop and mobile)
        run: npx playwright test
      - name: Keep the report when journeys fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
